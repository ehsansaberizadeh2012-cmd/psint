<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اتاق‌های رنگ‌بازی</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script><style>@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap');*{box-sizing:border-box}body{margin:0;background:#f5f3ef;font-family:Vazirmatn,sans-serif;color:#252438}.wrap{max-width:780px;margin:35px auto;padding:18px}.card{background:white;border:1px solid #ebe9e3;border-radius:18px;padding:22px;margin-bottom:16px}h1{font-size:23px}h2{font-size:17px;margin:0 0 12px}p{color:#77788a;font-size:13px;line-height:1.8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:12px;color:#686879}input,select{width:100%;padding:10px;border:1px solid #e7e5e0;border-radius:10px;font:14px Vazirmatn;margin-top:5px}button,.btn{background:#7256e8;color:white;border:0;padding:11px 15px;border-radius:10px;font:600 13px Vazirmatn;cursor:pointer;text-decoration:none;display:inline-block}.toggle{display:flex;gap:18px;margin:12px 0}.toggle label{display:flex;align-items:center;gap:5px}.toggle input{width:auto}.hidden{display:none}.room{padding:12px;border:1px solid #eee;border-radius:12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center}.row{display:flex;gap:9px;align-items:end;margin-top:12px}.row>*{flex:1}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#252438;color:white;padding:10px 16px;border-radius:10px;display:none}#qr{display:block;margin:12px auto} @media(max-width:560px){.grid{grid-template-columns:1fr}.wrap{margin:10px auto;padding:12px}}</style><body><div class="wrap"><h1>🎨 اتاق‌های رنگ‌بازی</h1><div class="card"><h2>ساخت اتاق</h2><div class="toggle"><label><input type="radio" name="vis" value="public" checked> عمومی</label><label><input type="radio" name="vis" value="private"> خصوصی</label></div><div class="grid"><label>ظرفیت بازیکن (۲ تا ۱۰۰۰)<input id="capacity" type="number" min="2" max="1000" value="2"></label><label>حداقل Level<input id="level" type="number" min="0" value="0"></label></div><div class="toggle"><label><input id="needprofile" type="checkbox"> داشتن پروفایل الزامی</label><label><input id="needreg" type="checkbox"> ثبت‌نام الزامی</label></div><label>نام نمایشی<input id="name" placeholder="نام بازیکن"></label><button id="create" style="margin-top:13px">ساخت اتاق و دریافت کد</button><div id="created" class="hidden"><p>کد اتاق: <b id="code"></b></p><canvas id="qr"></canvas><div id="qrFallback" style="display:none;width:190px;height:190px;margin:12px auto"></div><button id="copy">کپی لینک دعوت</button> <a class="btn" id="enter">ورود به اتاق</a></div></div><div class="card"><h2>ورود با کد اتاق</h2><div class="row"><label>کد روم<input id="joincode" maxlength="6" placeholder="مثلاً A1B2C3"></label><button id="join">پیوستن</button></div></div><div class="card"><h2>اتاق‌های عمومی</h2><div id="publicrooms" class="muted">در حال دریافت فهرست…</div></div><p>برای اتاق خصوصی، کد/لینک دعوت را فقط با افراد موردنظر به اشتراک بگذار.</p></div><div class="toast" id="toast"></div><script>
const sb=supabase.createClient('https://llynqqxiaupxhrtyxslq.supabase.co','sb_publishable_lNU8t0m5ULWrELrsHTyKhQ_lsrfplNA');const idKey='rb-profile-id';let pid=localStorage.getItem(idKey);if(!pid){pid=crypto.randomUUID();localStorage.setItem(idKey,pid)}const nm=()=>document.getElementById('name').value.trim()||localStorage.getItem('rb-name')||'بازیکن';function toast(s){let e=document.getElementById('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',2600)}function go(code){let u=new URL('index.html',location.href);u.searchParams.set('room',code);let g=new URLSearchParams(location.search).get('game')||localStorage.getItem('rb-selected-game');if(g)u.searchParams.set('game',g);location.href=u.href}async function join(code){let {data,error}=await sb.rpc('join_game_room',{p_code:code,p_member:pid,p_name:nm(),p_level:0,p_has_profile:!!localStorage.getItem('rb-name'),p_is_registered:false});if(error)return toast(error.message);go(data.code)}document.getElementById('join').onclick=()=>join(document.getElementById('joincode').value.trim().toUpperCase());document.getElementById('create').onclick=async()=>{let vis=document.querySelector('[name=vis]:checked').value,cap=+document.getElementById('capacity').value;if(cap<2||cap>1000)return toast('ظرفیت باید بین ۲ تا ۱۰۰۰ باشد');const {data,error}=await sb.rpc('create_game_room',{p_owner:pid,p_visibility:vis,p_capacity:cap,p_min_level:+document.getElementById('level').value||0,p_requires_profile:document.getElementById('needprofile').checked,p_requires_registration:document.getElementById('needreg').checked,p_name:nm()});if(error)return toast(error.message);let code=data.code,url=new URL('index.html',location.href);url.searchParams.set('room',code);document.getElementById('created').classList.remove('hidden');document.getElementById('code').textContent=code;let game=new URLSearchParams(location.search).get('game')||localStorage.getItem('rb-selected-game');if(game)url.searchParams.set('game',game);document.getElementById('enter').href=url.href;try{if(!window.QRCode?.toCanvas)throw Error('QR library unavailable');await QRCode.toCanvas(document.getElementById('qr'),url.href,{width:190,margin:2});document.getElementById('qr').style.display='block'}catch(qe){let box=document.getElementById('qrFallback');box.innerHTML='';box.style.display='block';document.getElementById('qr').style.display='none';let fallback=document.createElement('script');fallback.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';fallback.onload=()=>new QRCode(box,{text:url.href,width:190,height:190});fallback.onerror=()=>toast('کتابخانه QR بارگذاری نشد؛ لینک دعوت را کپی کن');document.head.appendChild(fallback)} document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(url.href);toast('لینک دعوت کپی شد')};await loadRooms()};async function loadRooms(){let {data,error}=await sb.from('game_rooms').select('code,capacity,min_level').eq('visibility','public').order('created_at',{ascending:false}).limit(30);let box=document.getElementById('publicrooms');if(error){box.textContent='فهرست بارگذاری نشد؛ تنظیمات migration را بررسی کن.';return}box.innerHTML=data.length?data.map(r=>`<div class="room"><span>اتاق ${r.code} · ظرفیت ${r.capacity} · حداقل Level ${r.min_level}</span><button onclick="join('${r.code}')">ورود</button></div>`).join(''):'هنوز اتاق عمومی‌ای ساخته نشده.'}loadRooms();
</script></body></html>
