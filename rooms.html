<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اتاق‌های رنگ‌بازی</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap');
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#f5f3ef;font:14px Vazirmatn,sans-serif;color:#252438}
.wrap{max-width:760px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#7256e8,#4e3bc0);color:#fff;border-radius:22px;padding:22px;margin-bottom:14px}.hero h1{margin:0 0 4px;font-size:24px}.hero p{margin:0;opacity:.85}
.card{background:#fff;border:1px solid #ebe9e3;border-radius:18px;padding:18px;margin-bottom:14px}h2{font-size:16px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:12px;color:#686879}input[type=number],input[type=text]{width:100%;padding:10px;border:1px solid #e7e5e0;border-radius:10px;font:14px Vazirmatn;margin-top:5px}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.seg label{margin:0;cursor:pointer}.seg input{display:none}.seg span{display:block;padding:9px 14px;border:1px solid #e7e5e0;border-radius:11px;color:#252438;font-size:13px}.seg input:checked+span{background:#7256e8;border-color:#7256e8;color:#fff}
button,.btn{background:#7256e8;color:#fff;border:0;padding:10px 15px;border-radius:10px;font:600 13px Vazirmatn;cursor:pointer;text-decoration:none;display:inline-block}.sec{background:#f0edff;color:#5c45cb}
.room{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 13px;border:1px solid #eee;border-radius:12px;margin-top:8px}.room b{letter-spacing:2px}.room small{color:#77788a}
.row{display:flex;gap:9px;align-items:end}.row>label{flex:1}#qr{display:block;margin:12px auto}.code{font-size:30px;font-weight:800;letter-spacing:5px;text-align:center;color:#5c45cb}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#252438;color:#fff;padding:10px 16px;border-radius:10px}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body>
<div class="wrap"><div class="hero"><h1>اتاق‌های بازی</h1><p>اتاق بساز، کد را برای دوستانت بفرست و با هم بازی کنید.</p></div>
<div class="card"><h2>بازی</h2><div class="seg" id="games"><label><input type="radio" name="g" value="draw"><span>🎨 بوم نقاشی</span></label><label><input type="radio" name="g" value="guess"><span>🕵️ نقاشی و حدس</span></label><label><input type="radio" name="g" value="sf"><span>🔤 اسم‌فامیل</span></label></div>
<h2>ساخت اتاق</h2><div class="seg"><label><input type="radio" name="vis" value="public" checked><span>عمومی (در فهرست)</span></label><label><input type="radio" name="vis" value="private"><span>خصوصی (فقط با کد)</span></label></div>
<div class="grid"><label>ظرفیت (۲ تا ۱۰۰۰)<input id="cap" type="number" min="2" max="1000" value="8"></label><label>حداقل Level<input id="lvl" type="number" min="0" value="0"></label></div>
<button id="create" style="margin-top:13px">ساخت اتاق</button>
<div id="made" hidden><div class="code" id="code"></div><canvas id="qr"></canvas><div style="text-align:center"><button id="copy" class="sec">کپی لینک دعوت</button> <a class="btn" id="enter">ورود به اتاق</a></div></div></div>
<div class="card"><h2>ورود با کد</h2><div class="row"><label>کد اتاق<input id="jc" type="text" maxlength="6" placeholder="مثلاً K7M2QX" style="text-transform:uppercase"></label><button id="join">پیوستن</button></div></div>
<div class="card"><h2>اتاق‌های عمومی</h2><div id="list">در حال دریافت…</div></div>
<a href="index.html" class="btn sec">بازگشت به صفحه‌ی اصلی</a></div><div class="toast" id="toast" hidden></div>
<script>
const sb=supabase.createClient('https://llynqqxiaupxhrtyxslq.supabase.co','sb_publishable_lNU8t0m5ULWrELrsHTyKhQ_lsrfplNA'),$=i=>document.getElementById(i);
const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const toast=t=>{const x=$('toast');x.textContent=t;x.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>x.hidden=true,2800)};
let game=new URLSearchParams(location.search).get('game')||localStorage.getItem('rb-selected-game')||'draw';
document.querySelectorAll('[name=g]').forEach(r=>{r.checked=r.value===game;r.onchange=()=>{game=r.value;localStorage.setItem('rb-selected-game',game)}});
const link=c=>{const u=new URL('index.html',location.href);u.searchParams.set('room',c);u.searchParams.set('game',game);return u.href};
async function join(code){const{data,error}=await sb.rpc('join_game_room',{p_code:code});if(error)return toast(error.message);location.href=link(data.code)}
$('join').onclick=()=>join($('jc').value.trim().toUpperCase());
$('create').onclick=async()=>{const cap=+$('cap').value;if(!(cap>=2&&cap<=1000))return toast('ظرفیت باید بین ۲ تا ۱۰۰۰ باشد');
 const{data,error}=await sb.rpc('create_game_room',{p_visibility:document.querySelector('[name=vis]:checked').value,p_capacity:cap,p_min_level:+$('lvl').value||0});if(error)return toast(error.message);
 const u=link(data.code);$('code').textContent=data.code;$('made').hidden=false;$('enter').href=u;$('copy').onclick=async()=>{await navigator.clipboard.writeText(u);toast('لینک دعوت کپی شد')};
 try{await QRCode.toCanvas($('qr'),u,{width:180,margin:2});$('qr').hidden=false}catch{$('qr').hidden=true}list()};
async function list(){const{data,error}=await sb.rpc('list_public_rooms');const b=$('list');if(error){b.textContent='فهرست بارگذاری نشد؛ فایل room-system-v2.sql را اجرا کن.';return}
 if(!data.length){b.textContent='هنوز اتاق عمومی‌ای نیست؛ اولین اتاق را تو بساز.';return}
 b.replaceChildren(...data.map(r=>{const d=h('div','room'),s=h('span');s.append(h('b',null,r.code),h('small',null,`  ${r.players} از ${r.capacity} بازیکن · Level ${r.min_level}+`));const j=h('button',null,'ورود');j.onclick=()=>join(r.code);d.append(s,j);return d}))}
sb.auth.getSession().then(({data})=>{if(!data.session)location.href='index.html';else{list();setInterval(list,10000)}});
</script></body></html>
